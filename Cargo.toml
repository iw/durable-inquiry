[workspace]
resolver = "3"
members = [
    "crates/durable-inquiry-domain",
    "crates/durable-inquiry-knowledge",
    "crates/durable-inquiry-evidence",
    "crates/durable-inquiry-samples",
    "crates/durable-inquiry-collect",
    "crates/durable-inquiry-diagrams",
    "crates/durable-inquiry-dashboards",
    "crates/durable-inquiry-diagnostics",
    "crates/durable-inquiry-app",
    "crates/durable-inquiry-odori",
    "crates/durable-inquiry-sim",
    "crates/durable-inquiry-extract",
    "crates/durable-inquiry-web",
    "crates/durable-inquiry",
    "demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iw/durable-inquiry"
homepage = "https://github.com/iw/durable-inquiry"
publish = false

[workspace.dependencies]
durable-inquiry-domain = { path = "crates/durable-inquiry-domain" }
durable-inquiry-knowledge = { path = "crates/durable-inquiry-knowledge" }
durable-inquiry-evidence = { path = "crates/durable-inquiry-evidence" }
durable-inquiry-samples = { path = "crates/durable-inquiry-samples" }
durable-inquiry-collect = { path = "crates/durable-inquiry-collect" }
durable-inquiry-diagrams = { path = "crates/durable-inquiry-diagrams" }
durable-inquiry-dashboards = { path = "crates/durable-inquiry-dashboards" }
durable-inquiry-diagnostics = { path = "crates/durable-inquiry-diagnostics" }
durable-inquiry-app = { path = "crates/durable-inquiry-app" }
durable-inquiry-odori = { path = "crates/durable-inquiry-odori" }
durable-inquiry-sim = { path = "crates/durable-inquiry-sim" }
durable-inquiry-web = { path = "crates/durable-inquiry-web" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
crc32fast = "1"
csv = "1"
miniz_oxide = "0.9"
getrandom = "0.4"
hmac = "0.13"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
pretty_assertions = "1"
qrcode = { version = "0.14", default-features = false }
# Rust TLS, with the system's certificate store and the webpki roots; no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

# Odori: durable agent workflows on the embedded tokeira engine.
odori = "0.3.0"
temporalio-client = "1.0"
temporalio-common = "1.0"
temporalio-macros = "1.0"
temporalio-sdk = "1.0"
temporalio-workflow = "1.0"
futures = "0.3"

# Durable Envision: a discrete-event simulator of Temporal Server clusters, pinned
# to a commit on its main branch. Only durable-inquiry-sim runs it;
# durable_inquiry_sim::DURABLE_ENVISION_COMMIT repeats the rev, and a test checks
# that the two agree. At this commit its package is named `tempdes`, so the
# dependency is renamed here and the code says `durable_envision::`.
durable-envision = { package = "tempdes", git = "https://github.com/iw/durable-envision", rev = "22b8dc97f181c88f70ba723842b293668645f2a8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
# macOS ld reports that the debug binary's __eh_frame is too large for compact
# unwind tables. It is harmless, and would otherwise print on every build.
linker_messages = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Durable Envision simulates a cluster request by request; unoptimised, a test's
# few simulated minutes would take minutes rather than seconds. A profile is
# keyed on the package's own name, which is `tempdes` at the pinned commit, not
# on the name the dependency is given above.
[profile.dev.package.tempdes]
opt-level = 3
